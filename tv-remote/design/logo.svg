<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB4A2"/>
      <stop offset="0.5" stop-color="#F79AC0"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3EEFF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8FA3"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6D28D9" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <!-- phone -->
  <g filter="url(#shadow)">
    <rect x="146" y="70" width="220" height="372" rx="52" fill="url(#phone)"/>
  </g>
  <rect x="226" y="88" width="60" height="12" rx="6" fill="#E9E1FF"/>
  <!-- remote d-pad -->
  <circle cx="256" cy="222" r="78" fill="none" stroke="url(#ring)" stroke-width="26"/>
  <circle cx="256" cy="222" r="30" fill="url(#ring)"/>
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M247 162l9-9 9 9"/><path d="M247 282l9 9 9-9"/>
    <path d="M196 213l-9 9 9 9"/><path d="M316 213l9 9-9 9"/>
  </g>
  <!-- buttons -->
  <rect x="196" y="334" width="50" height="22" rx="11" fill="#E4DAFE"/>
  <rect x="266" y="334" width="50" height="22" rx="11" fill="#E4DAFE"/>
  <rect x="196" y="370" width="120" height="22" rx="11" fill="#FFD3DE"/>
</svg>
