<style>
/* Layout: one-column phone app — a punch-clock card on top, bottom tab bar, the boss report as a formal sheet */
:root {
  --bg: #EAF0ED; --surface: #FFFFFF; --surface-2: #F4F7F5; --ink: #12241F; --muted: #5A6B66; --line: #D3DDD9;
  --accent: #0E7A5D; --accent-ink: #FFFFFF; --accent-soft: #D3ECE3; --punch: #C8470E; --punch-soft: #FBE2D4;
  --warn: #9A6A00; --danger: #B42318;
  --shadow: 0 1px 2px rgba(18,36,31,.06), 0 6px 20px rgba(18,36,31,.06);
  --f-display: "Secular One", "IBM Plex Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
  --f-body: "IBM Plex Sans Hebrew", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1614; --surface: #16211E; --surface-2: #1C2925; --ink: #E4EEEA; --muted: #93A6A0;
    --line: #2A3A36; --accent: #3DC79E; --accent-ink: #06231A; --accent-soft: #173A30;
    --punch: #FF8B52; --punch-soft: #3E2418; --warn: #E6B54A; --danger: #FF7A6E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) calc(84px + env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
.app { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.num, .mono { font-family: var(--f-num); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .6; cursor: default; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-size: 22px; line-height: 1.1; }
.brand .who { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.cloud::before { background: var(--accent); }
.sync.err::before { background: var(--danger); }
.sync.saving::before { background: var(--warn); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.card h3 { font-size: 17px; margin-bottom: 10px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-head h3 { margin: 0; }
.label { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.clock { text-align: center; padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.clock .now { font-size: 14px; color: var(--muted); }
.clock .now b { font-family: var(--f-num); color: var(--ink); font-weight: 600; }
.punch {
  width: 196px; height: 196px; max-width: 100%; border-radius: 50%; border: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 0 0 10px var(--accent-soft), 0 10px 30px rgba(14,122,93,.25); transition: transform .12s ease;
}
.punch:active { transform: scale(.97); }
.punch span { font-family: var(--f-display); font-size: 40px; line-height: 1; }
.punch small { font-size: 13px; opacity: .85; }
.status { display: inline-flex; gap: 8px; align-items: center; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13px; }
.status.break { background: var(--punch-soft); color: var(--punch); }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .status .dot { animation: none; } .punch { transition: none; } }
.elapsed { font-size: clamp(44px, 14vw, 64px); font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.earn { font-size: 15px; color: var(--muted); }
.earn b { color: var(--ink); }
.progress { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.progress .track { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; display: flex; }
.progress .fill { background: var(--accent); height: 100%; }
.progress .over { background: var(--punch); height: 100%; }
.progress .txt { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); gap: 8px; }
.breaks { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; font-size: 13px; }
.bchip { display: inline-flex; align-items: center; gap: 4px; background: var(--punch-soft); color: var(--punch); border: 0; border-radius: 999px; padding: 3px 4px 3px 10px; font-weight: 600; font-size: 13px; }
.bchip span.x { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; background: rgba(0,0,0,.08); font-size: 13px; line-height: 1; }
.btn-row { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }
.btn-row > * { flex: 1 1 140px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-weight: 600; min-height: 48px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.out { background: var(--punch); border-color: var(--punch); color: #fff; font-family: var(--f-display); font-size: 20px; font-weight: 400; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); background: transparent; }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 4px; text-decoration: underline; text-underline-offset: 3px; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat .v { font-family: var(--f-num); font-size: 20px; font-weight: 600; direction: ltr; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.hero { background: var(--accent); color: var(--accent-ink); grid-column: 1 / -1; order: -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.stat.hero .label { color: inherit; opacity: .85; }
.stat.hero .v { font-size: 26px; }

.pnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pnav h2 { font-size: 22px; text-align: center; }
.pnav .sub { font-size: 12px; color: var(--muted); text-align: center; display: block; font-family: var(--f-body); }
.pnav button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; }

.chart-wrap { overflow-x: auto; padding-bottom: 4px; }
.chart { display: flex; align-items: flex-end; gap: 3px; height: 130px; min-width: 100%; position: relative; padding-top: 6px; }
.bar { flex: 1 0 9px; display: flex; flex-direction: column-reverse; align-items: stretch; height: 100%; position: relative; }
.bar i { display: block; border-radius: 3px 3px 0 0; }
.bar i.reg { background: var(--accent); }
.bar i.ot { background: var(--punch); }
.bar i.reg + i.ot { margin-bottom: 1px; }
.bar.we::after { content: ""; position: absolute; inset: 0; background: var(--surface-2); z-index: -1; border-radius: 3px; }
.bar.today { outline: 1px dashed var(--muted); outline-offset: 1px; border-radius: 3px; }
.xlab { display: flex; gap: 3px; min-width: 100%; }
.xlab span { flex: 1 0 9px; font-size: 9px; color: var(--muted); text-align: center; font-family: var(--f-num); }
.tline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--muted); opacity: .6; pointer-events: none; }
.tline span { position: absolute; left: 0; top: -15px; font-size: 10px; color: var(--muted); background: var(--surface); padding: 0 3px; font-family: var(--f-num); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 5px; vertical-align: -1px; }

.kv { display: flex; flex-direction: column; }
.kv .r { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv .r:last-child { border-bottom: 0; }
.kv .r .k { min-width: 0; }
.kv .r .v { font-family: var(--f-num); direction: ltr; white-space: nowrap; }
.kv .r.total { font-weight: 700; font-size: 17px; border-top: 2px solid var(--ink); border-bottom: 0; margin-top: 4px; padding-top: 10px; }
.kv .r.total .v { color: var(--accent); }

.days { display: flex; flex-direction: column; gap: 8px; }
.day { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.day-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-2); }
.day-h .d { font-weight: 600; }
.day-h .d small { color: var(--muted); font-weight: 400; margin-inline-start: 6px; }
.day-h .t { text-align: left; font-size: 13px; }
.shift { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); width: 100%; background: none; border-inline: 0; border-bottom: 0; text-align: right; }
.shift:hover { background: var(--surface-2); }
.shift .tm { font-family: var(--f-num); direction: ltr; unicode-bidi: isolate; font-size: 14px; }
.shift .meta { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shift .h { font-family: var(--f-num); font-size: 14px; }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--punch-soft); color: var(--punch); font-weight: 600; white-space: nowrap; }
.chip.n { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty b { color: var(--ink); font-size: 16px; }
.banner { background: var(--punch-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; flex-wrap: wrap; }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px 16px; box-shadow: var(--shadow); }
.sheet-h { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 12px; }
.sheet-h h2 { font-size: 24px; }
.sheet-h .meta { font-size: 13px; color: var(--muted); display: grid; grid-template-columns: auto auto; gap: 2px 10px; }
.sheet-h .meta b { color: var(--ink); font-weight: 600; }
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table.rep { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 560px; }
table.rep th { text-align: right; font-size: 11px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--ink); padding: 6px; white-space: nowrap; }
table.rep td { padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.rep td.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
table.rep tr.we td { background: var(--surface-2); }
table.rep tfoot td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: 0; }
.sign { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 28px; font-size: 13px; color: var(--muted); }
.sign div { border-top: 1px solid var(--ink); padding-top: 6px; }
.export { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.export .btn { display: flex; flex-direction: column; align-items: flex-start; gap: 0; text-align: right; }
.export .btn small { font-weight: 400; color: var(--muted); font-size: 12px; }
.export .btn.primary small { color: inherit; opacity: .85; }
@media (max-width: 400px) { .export { grid-template-columns: 1fr; } }

.form { display: flex; flex-direction: column; gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld label { font-size: 13px; font-weight: 600; }
.fld .hint { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; min-height: 46px; width: 100%; min-width: 0; font-size: 16px;
}
input[type="time"], input[type="date"], input[type="number"], input[type="datetime-local"], input[type="tel"], input[type="email"] { font-family: var(--f-num); direction: ltr; text-align: right; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; cursor: pointer; }
.switch input { width: 46px; min-height: 26px; height: 26px; appearance: none; -webkit-appearance: none; border-radius: 999px; background: var(--line); position: relative; padding: 0; border: 0; flex: none; cursor: pointer; }
.switch input::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: right .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { right: 23px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 4px; font-size: 13px; font-weight: 600; min-height: 42px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; min-height: 34px; }
.calc-preview { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
.err-msg { color: var(--danger); font-size: 14px; min-height: 1em; }
.ok-msg { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 12px; font-size: 14px; }

/* auth */
.auth { min-height: calc(100vh - 120px); display: flex; flex-direction: column; justify-content: center; gap: 18px; padding-block: 24px; }
.auth-logo { display: flex; align-items: center; gap: 12px; }
.auth-logo img { width: 52px; height: 52px; border-radius: 14px; }
.auth-logo h1 { font-size: 28px; line-height: 1.1; }
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; border: 1px solid var(--line); }
.auth-tabs button { border: 0; background: transparent; border-radius: 9px; padding: 10px; font-weight: 600; color: var(--muted); }
.auth-tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.loading { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }

.overlay { position: fixed; inset: 0; background: rgba(8,16,14,.5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; padding-top: env(safe-area-inset-top, 0px); }
.modal { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 600px) { .overlay { align-items: center; } .modal { border-radius: 18px; } }
.modal h3 { font-size: 20px; }
.modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.modal-actions .btn { flex: 1 1 120px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 50; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
textarea.copy { min-height: 180px; font-family: var(--f-num); font-size: 13px; direction: rtl; }
.bgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.bgrid button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 4px; font-weight: 600; font-family: var(--f-num); }

.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; color: var(--muted); font-size: 12px; font-weight: 600; position: relative; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.nav .live { width: 7px; height: 7px; border-radius: 50%; background: var(--punch); position: absolute; top: 6px; margin-inline-start: 18px; }
</style>
</head>

</nav>

const localDS = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const normPhone = p => String(p || "").replace(/[^\d+]/g, "");

const DEFAULT_SETTINGS = {

  otEnabled: true, otThreshold: 8.6, ot1Span: 2,
  weekendOn: true, weekendRate: 150,
  travelOn: false, travelPerDay: 0, periodStart: 1,
  vacPct: 100, sickPct: 100, onboarded: false

const freshState = () => ({ v: 2, updatedAt: 0, settings: { ...DEFAULT_SETTINGS }, shifts: [], active: null, adjustments: [], sample: false });
function normalize(s) {
  s = JSON.parse(JSON.stringify(s || {}));
  const n = freshState();
  const out = { ...n, ...s, settings: { ...n.settings, ...(s.settings || {}) },
    shifts: Array.isArray(s.shifts) ? s.shifts : [], adjustments: Array.isArray(s.adjustments) ? s.adjustments : [],
    active: s.active && s.active.start ? s.active : null };
  if (out.active && !Array.isArray(out.active.breaks)) out.active = { ...out.active, breaks: [] };
  if (s.settings && s.settings.travelPerDay > 0 && s.settings.travelOn === undefined) out.settings.travelOn = true;
  return out;
}
let state = freshState();

// ---------- cloud sync ----------
let saving = false, dirty = false, saveTimer = null, syncState = "local";
function setSync(s) { syncState = s; const el = $("#sync"); if (el) paintSync(el); }
function paintSync(el) {
  const map = { local: ["", "לא מחובר לרשת"], cloud: ["cloud", "מגובה בענן"], saving: ["saving", "שומר…"], err: ["err", "ממתין לרשת"] };
  const [c, t] = map[syncState] || map.local;
  el.className = "sync " + c; el.textContent = t;
}
function commit(msg, noRender) {
  state.updatedAt = Date.now();
  saveCache(); if (!noRender) render();
  if (msg) toast(msg);
  dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500);
}
async function flush() {
  if (saving || !dirty || !session) return;
  saving = true; dirty = false; setSync("saving");
  const payload = JSON.parse(JSON.stringify(state));
  const { error } = await sb.from("attendance_accounts").update({ data: payload, full_name: state.settings.name || account?.full_name || "", updated_at: new Date().toISOString() }).eq("user_id", session.user.id);
  saving = false;
  if (error) { dirty = true; setSync("err"); setTimeout(flush, 5000 + Math.random() * 3000); return; }
  setSync("cloud");
  if (dirty) flush();
}
async function pullRemote() {
  if (!session) return;
  const { data, error } = await sb.from("attendance_accounts").select("phone, full_name, email, data").eq("user_id", session.user.id).maybeSingle();
  if (error) { setSync("err"); return "error"; }
  if (!data) return "missing";
  account = { phone: data.phone, full_name: data.full_name, email: data.email };
  const remote = data.data || {};
  const rT = remote.updatedAt || 0;
  if (rT > state.updatedAt) { state = normalize(remote); saveCache(); }
  else if (rT < state.updatedAt) { dirty = true; flush(); }
  if (!state.settings.name && data.full_name) state.settings = { ...state.settings, name: data.full_name };
  setSync(dirty ? "saving" : "cloud");
  return "ok";
}
async function createAccount(phone, fullName) {
  const u = session.user;
  const row = { user_id: u.id, phone: normPhone(phone), full_name: fullName || "", email: u.email, data: JSON.parse(JSON.stringify(state)) };
  const { error } = await sb.from("attendance_accounts").insert(row);
  if (error && error.code !== "23505") throw error;
  account = { phone: row.phone, full_name: row.full_name, email: u.email };
}
window.addEventListener("online", () => { if (dirty) flush(); else pullRemote().then(() => render()); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (dirty) flush(); return; }
  if (!session) return;
  if (!dirty && !saving) pullRemote().then(r => { if (r === "ok" && !$("#modal-root").firstChild) render(); });
  else tick();
});

// ---------- boot / auth ----------
async function startSession(s) {
  session = s;
  try { const c = localStorage.getItem(cacheKey()); state = c ? normalize(JSON.parse(c)) : freshState(); } catch (e) { state = freshState(); }
  render(); // show cached data right away
  const r = await pullRemote();
  if (r === "missing") {
    const meta = s.user.user_metadata || {};
    if (meta.phone && validPhone(meta.phone)) {
      if (!state.settings.name && meta.full_name) state.settings = { ...state.settings, name: meta.full_name };
      try { await createAccount(meta.phone, meta.full_name || state.settings.name); setSync("cloud"); }
      catch (e) { setSync("err"); }
    } else { ui.needPhone = true; }
  }
  render();
}
function endSession() {
  try { if (cacheKey()) localStorage.removeItem(cacheKey()); } catch (e) {}
  session = null; account = null; state = freshState(); ui.needPhone = false; ui.authMode = "login";
  render();
}
sb.auth.onAuthStateChange((event, s) => {

  if (s) session = s;

const authErr = msg => { const e = $("#auth-err"); if (e) e.textContent = msg; };
function heAuthError(err) {
  const m = (err && err.message || "").toLowerCase();
  if (m.includes("invalid login")) return "המייל או הסיסמה לא נכונים";
  if (m.includes("email not confirmed")) return "צריך לאשר את המייל קודם. חפשו את מייל האימות בתיבה שלכם.";
  if (m.includes("already registered") || m.includes("already been registered")) return "המייל הזה כבר רשום. נסו להתחבר.";
  if (m.includes("password")) return "הסיסמה צריכה להיות לפחות 6 תווים";
  if (m.includes("rate limit") || m.includes("too many")) return "יותר מדי ניסיונות. חכו כמה דקות ונסו שוב.";
  if (m.includes("fetch") || m.includes("network")) return "אין חיבור לאינטרנט";

}
document.addEventListener("submit", async e => {

    const signup = ui.authMode === "signup";
    const email = $("#au-email").value.trim(), pass = $("#au-pass").value;
    ui.authEmail = email;
    if (!validEmail(email)) return authErr("כתובת המייל לא תקינה");
    if (pass.length < 6) return authErr("הסיסמה צריכה להיות לפחות 6 תווים");
    let name = "", phone = "";
    if (signup) {
      name = $("#au-name").value.trim(); phone = $("#au-phone").value.trim();
      if (!name) return authErr("מלאו שם מלא");
      if (!validPhone(phone)) return authErr("מספר הטלפון לא תקין");
    }
    const btn = $("#auth-submit"); btn.disabled = true; authErr("");
    if (signup) {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { full_name: name, phone: normPhone(phone) }, emailRedirectTo: location.origin + "/" } });
      btn.disabled = false;
      if (error) return authErr(heAuthError(error));
      if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return authErr("המייל הזה כבר רשום. נסו להתחבר.");

  }
});

// ---------- pay periods ----------
const PS = () => Math.min(28, Math.max(1, Math.round(+state.settings.periodStart || 1)));
function periodKeyOf(ds) {
  const [y, m, d] = parseDS(ds);
  if (PS() === 1 || d < PS()) return `${y}-${pad(m)}`;
  const n = utc(y, m + 1, 1);
  return `${n.getUTCFullYear()}-${pad(n.getUTCMonth() + 1)}`;
}
function periodRange(key) {
  const [y, m] = key.split("-").map(Number);
  if (PS() === 1) return [`${y}-${pad(m)}-01`, `${y}-${pad(m)}-${pad(daysIn(y, m))}`];
  return [utcDS(utc(y, m - 1, PS())), `${y}-${pad(m)}-${pad(PS() - 1)}`];
}
function movePeriod(key, delta) { const [y, m] = key.split("-").map(Number); const d = utc(y, m + delta, 1); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}`; }
function periodLabel(key) { const [y, m] = key.split("-").map(Number); return `${MONTHS[m - 1]} ${y}`; }
function periodSub(key) { if (PS() === 1) return ""; const [a, b] = periodRange(key); return `${fmtDate(a)} – ${fmtDate(b)}`; }
function datesBetween(a, b) {
  const out = []; const [y, m, d] = parseDS(a); const cur = utc(y, m, d);
  while (utcDS(cur) <= b && out.length < 40) { out.push(utcDS(cur)); cur.setUTCDate(cur.getUTCDate() + 1); }
  return out;
}

// ---------- calculations ----------
const isLeave = s => s.type === "vacation" || s.type === "sick";
function shiftMin(s) {
  if (isLeave(s)) return Math.max(0, Math.round((+s.hours || 0) * 60));
  let a = toMin(s.start), b = toMin(s.end);
  if (b <= a) b += 1440;
  return Math.max(0, b - a - (+s.breakMin || 0));
}
const isWeekendDate = ds => state.settings.weekendOn && weekday(ds) === 6;
function calcDay(ds, list) {
  const st = state.settings, rate = +st.rate || 0;
  const work = list.filter(s => !isLeave(s));
  const wMin = work.reduce((a, s) => a + shiftMin(s), 0);
  const special = isWeekendDate(ds) || (st.weekendOn && work.some(s => s.type === "holiday"));
  let reg = wMin, o1 = 0, o2 = 0;
  if (st.otEnabled) {
    const T = Math.max(0, +st.otThreshold || 0) * 60, span = Math.max(0, +st.ot1Span || 0) * 60;
    reg = Math.min(wMin, T); o1 = Math.min(Math.max(wMin - T, 0), span); o2 = Math.max(wMin - T - span, 0);
  }
  const base = special ? (+st.weekendRate || 150) / 100 : 1;
  const mults = [base, base + .25, base + .5];
  const buckets = {};
  [reg, o1, o2].forEach((mn, i) => { if (mn > 0) { const k = Math.round(mults[i] * 100); buckets[k] = (buckets[k] || 0) + mn; } });
  const workPay = [reg, o1, o2].reduce((a, mn, i) => a + rate * mn / 60 * mults[i], 0);
  let vacMin = 0, sickMin = 0;
  list.forEach(s => { if (s.type === "vacation") vacMin += shiftMin(s); if (s.type === "sick") sickMin += shiftMin(s); });
  const vacPay = rate * vacMin / 60 * (+st.vacPct || 0) / 100;
  const sickPay = rate * sickMin / 60 * (+st.sickPct || 0) / 100;
  return { ds, list, wMin, reg, ot: o1 + o2, buckets, special, workPay, vacMin, sickMin, vacPay, sickPay, pay: workPay + vacPay + sickPay };
}
function calcPeriod(key) {
  const [a, b] = periodRange(key);
  const by = {};
  state.shifts.forEach(s => { if (s.date >= a && s.date <= b) (by[s.date] = by[s.date] || []).push(s); });
  const days = Object.keys(by).sort().map(ds => {
    by[ds].sort((x, y) => (x.start || "").localeCompare(y.start || ""));
    return calcDay(ds, by[ds]);
  });
  const t = { wMin: 0, buckets: {}, workPay: 0, vacMin: 0, sickMin: 0, vacPay: 0, sickPay: 0, daysWorked: 0, otMin: 0 };
  days.forEach(d => {
    t.wMin += d.wMin; t.workPay += d.workPay; t.vacMin += d.vacMin; t.sickMin += d.sickMin;
    t.vacPay += d.vacPay; t.sickPay += d.sickPay; t.otMin += d.ot; if (d.wMin > 0) t.daysWorked++;
    for (const k in d.buckets) t.buckets[k] = (t.buckets[k] || 0) + d.buckets[k];
  });
  t.travel = state.settings.travelOn ? t.daysWorked * (+state.settings.travelPerDay || 0) : 0;
  t.adj = state.adjustments.filter(x => x.period === key);
  t.adjSum = t.adj.reduce((a, x) => a + (+x.amount || 0), 0);
  t.total = t.workPay + t.vacPay + t.sickPay + t.travel + t.adjSum;
  t.allMin = t.wMin + t.vacMin + t.sickMin;
  return { key, range: [a, b], days, t };
}
const fixedBreakMin = a => (a.breaks || []).reduce((s, b) => s + (+b.min || 0), 0);
function activeBreakMs(a, now = Date.now()) { return fixedBreakMin(a) * 60000 + (a.breakMs || 0) + (a.breakStart ? now - a.breakStart : 0); }
function activeWorkedMs(now = Date.now()) {
  const a = state.active; if (!a) return 0;
  return Math.max(0, now - a.start - activeBreakMs(a, now));
}

function chart(P) {
  const dates = datesBetween(P.range[0], P.range[1]);
  const map = {}; P.days.forEach(d => map[d.ds] = d);
  const T = state.settings.otEnabled ? (+state.settings.otThreshold || 0) * 60 : 0;
  const maxMin = Math.max(600, ...P.days.map(d => d.wMin + d.vacMin + d.sickMin));
  const today = todayDS();
  const bars = dates.map(ds => {
    const d = map[ds]; const we = isWeekendDate(ds);
    const cls = `bar${we ? " we" : ""}${ds === today ? " today" : ""}`;
    if (!d) return `<div class="${cls}" title="${fmtDate(ds)}"></div>`;
    const reg = d.reg + d.vacMin + d.sickMin, ot = d.ot;

function tick() {
  const n = $("#now-time"); if (n) n.textContent = localHM(new Date());
  const el = $("#elapsed"); if (!el || !state.active) return;
  const ms = activeWorkedMs(); const s = Math.floor(ms / 1000);
  el.textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  const e = $("#earn-live"); const rate = +state.settings.rate || 0;
  if (e) e.innerHTML = rate ? `הרווחתם עד עכשיו בערך <b class="num">${money(rate * ms / 3600000)}</b>` : `<span class="small">הגדירו תעריף כדי לראות כמה הרווחתם</span>`;
  const p = $("#prog"); const goal = (+state.settings.shiftHours || 0) * 3600000;
  if (p && goal) {
    const pct = Math.min(100, ms / goal * 100), overMs = Math.max(0, ms - goal);
    const overPct = overMs ? Math.min(40, overMs / goal * 100) : 0;
    const left = Math.max(0, goal - ms) / 60000;
    p.innerHTML = `<div class="track"><div class="fill" style="width:${pct * (100 - overPct) / 100}%"></div>${overPct ? `<div class="over" style="width:${overPct}%"></div>` : ""}</div>
      <div class="txt"><span>משמרת של ${+state.settings.shiftHours} ש׳</span><span>${overMs ? `<b style="color:var(--punch)">עברת ב-<span class="num">${fmtHM(overMs / 60000)}</span></b>` : `נשארו <span class="num">${fmtHM(left)}</span>`}</span></div>`;
  }
  const br = $("#break-run"); if (br && state.active.breakStart) { const bs = Math.floor((Date.now() - state.active.breakStart) / 1000); br.textContent = `${pad(Math.floor(bs / 60))}:${pad(bs % 60)}`; }
}
setInterval(tick, 1000);

function downloadFile(filename, data, mime) {

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function shareOrDownload(filename, data, mime) {
  try {

}

.note{color:#666;font-size:12px;margin-top:14px}.sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:48px;color:#555}.sign div{border-top:1px solid #111;padding-top:6px}
@media print{body{margin:10mm}}</style></head><body>
<div class="head"><div><h1>דוח שעות עבודה</h1><div>${esc(periodLabel(P.key))} · ${fmtDate(a)} – ${fmtDate(b)}</div></div>
<div class="meta"><span>עובד/ת:</span><b>${esc(st.name || "—")}</b>${account && account.phone ? `<span>טלפון:</span><b>${esc(account.phone)}</b>` : ""}<span>מעסיק:</span><b>${esc(st.employer || "—")}</b><span>תעריף:</span><b>${money(+st.rate || 0)} לשעה</b></div></div>
<div class="wrap">${reportTable(P)}</div>
<div class="sum">${summaryRows(P).map(([k, v]) => `<div><span>${esc(k.trim())}</span><span>${esc(v)}</span></div>`).join("")}</div>
<p class="note">${rulesNote()} הופק ב-${fmtDate(todayDS())}.</p>
<div class="sign"><div>חתימת העובד/ת</div><div>אישור המעסיק</div></div>
${autoPrint ? "<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script>" : ""}</body></html>`;
}
function summaryText(P) {
  const st = state.settings; const [a, b] = P.range;
  const lines = [`דוח שעות – ${st.name || "עובד/ת"}`, `${st.employer ? st.employer + " · " : ""}${periodLabel(P.key)} (${fmtDate(a)}–${fmtDate(b)})`, ""];
  summaryRows(P).forEach(([k, v], i, arr) => lines.push(`${i === arr.length - 1 ? "*" : ""}${k}: ${v}${i === arr.length - 1 ? "*" : ""}`));
  lines.push("", `תעריף: ${money(+st.rate || 0)} לשעה`);
  return lines.join("\n");
}
async function shareText(text, title) {
  if (navigator.share) { try { await navigator.share({ text, title }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(text); toast("הסיכום הועתק — אפשר להדביק בוואטסאפ"); }
  catch (e) { showCopy(title, text); }
}
function printReport(P) {
  const html = htmlReportFor(P, true);
  const w = window.open("", "_blank");
  if (w) { w.document.open(); w.document.write(html); w.document.close(); }
  else downloadFile(`דוח שעות ${periodLabel(P.key)}.html`, html, "text/html");
}

// ---------- sample data ----------
function loadSample() {
  const key = periodKeyOf(todayDS()); const [a] = periodRange(key);
  const end = todayDS(); const out = [];
  const starts = ["07:55", "08:02", "08:10", "07:48", "08:00", "08:05"];
  const ends = ["17:05", "16:40", "18:45", "17:30", "19:20", "16:55"];
  datesBetween(a, end).forEach((ds, i) => {
    if (ds === end) return;
    const wd = weekday(ds);
    if (wd === 5) return;
    if (wd === 6) { if (i % 14 === 6) out.push({ id: uid(), date: ds, start: "09:00", end: "14:00", breakMin: 0, type: "work", note: "דוגמה · משמרת שבת" }); return; }
    if (i === 9) { out.push({ id: uid(), date: ds, type: "vacation", hours: +state.settings.shiftHours || 8, start: "", end: "", breakMin: 0, note: "דוגמה" }); return; }
    out.push({ id: uid(), date: ds, start: starts[i % 6], end: ends[i % 6], breakMin: [15, 30, 45][i % 3], type: "work", note: "דוגמה" });
  });
  state.shifts = out; state.sample = true;
  if (!(+state.settings.rate > 0)) state.settings = { ...state.settings, rate: 45 };
  state.adjustments = [{ id: uid(), period: key, label: "בונוס (דוגמה)", amount: 300 }];
  ui.period = key; ui.tab = "month";
  commit("נטענו נתוני דוגמה");
}
function clearSample() {
  confirmBox("לנקות את נתוני הדוגמה?", "כל המשמרות והתוספות לדוגמה יימחקו. ההגדרות שלכם יישארו.", "ניקוי", () => {
    state.shifts = []; state.adjustments = []; state.sample = false; commit("הדוגמה נוקתה");
  }, true);
}

// ---------- events ----------
document.addEventListener("click", e => {
  const au = e.target.closest("[data-auth]");
  if (au) {
    const t = au.dataset.auth; ui.authMsg = "";
    const em = $("#au-email"); if (em) ui.authEmail = em.value.trim();
    ui.authMode = t === "toSignup" ? "signup" : t === "toForgot" ? "forgot" : "login";
    render(); return;
  }
  const nav = e.target.closest("[data-tab]");
  if (nav && nav.closest("#nav")) { goTab(nav.dataset.tab); return; }
  const go = e.target.closest("[data-tab-go]"); if (go) { goTab(go.dataset.tabGo); return; }
  const rb = e.target.closest("[data-rmbreak]"); if (rb) { removeBreak(rb.dataset.rmbreak); return; }
  const ed = e.target.closest("[data-edit]"); if (ed) { const s = state.shifts.find(x => x.id === ed.dataset.edit); if (s) shiftForm(s); return; }
  const adj = e.target.closest("[data-adj]"); if (adj) { const x = state.adjustments.find(y => y.id === adj.dataset.adj); if (x) adjForm(x.period, x); return; }
  const act = e.target.closest("[data-act]"); if (!act || act.closest("#modal-root")) return;
  const P = () => calcPeriod(ui.period);
  const st = state.settings; const fname = k => `דוח שעות ${st.name ? st.name + " " : ""}${periodLabel(k)}`;
  switch (act.dataset.act) {
    case "clockIn": clockIn(); break;
    case "clockOut": clockOut(); break;
    case "addBreak": breakModal(); break;
    case "endBreak": endTimedBreak(); break;
    case "editActive": editActive(); break;
    case "addShift": shiftForm(null, ui.tab === "month" && periodKeyOf(todayDS()) !== ui.period ? periodRange(ui.period)[0] : null); break;
    case "addAdj": adjForm(ui.period); break;
    case "prevP": ui.period = movePeriod(ui.period, -1); render(); break;
    case "nextP": ui.period = movePeriod(ui.period, 1); render(); break;
    case "shareSummary": shareText(summaryText(P()), "סיכום שעות"); break;
    case "dlCsv": shareOrDownload(fname(ui.period) + ".csv", csvFor(P()), "text/csv"); break;
    case "dlHtml": shareOrDownload(fname(ui.period) + ".html", htmlReportFor(P(), false), "text/html"); break;
    case "printReport": printReport(P()); break;
    case "backup": downloadFile(`גיבוי שעון נוכחות ${todayDS()}.json`, JSON.stringify(state, null, 1), "application/json"); break;
    case "restore": $("#restore-file").click(); break;
    case "loadSample": loadSample(); break;
    case "clearSample": clearSample(); break;
    case "finishSetup": state.settings = { ...state.settings, onboarded: true }; commit("מעולה, אפשר להתחיל"); break;
    case "install": if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } break;
    case "dismissInstall": try { localStorage.setItem("attendance:install-dismissed", "1"); } catch (err) {} render(); break;
    case "logout": confirmBox("להתנתק?", "הנתונים שמורים בחשבון ויחזרו כשתתחברו שוב.", "התנתקות", async () => { if (dirty) await flush(); await sb.auth.signOut(); endSession(); }); break;
    case "wipe": confirmBox("למחוק את כל המשמרות?", "כל המשמרות והתוספות יימחקו לצמיתות, גם מהגיבוי בענן. ההגדרות והחשבון יישארו.", "מחיקה לצמיתות", () => { state.shifts = []; state.adjustments = []; state.active = null; state.sample = false; commit("כל המשמרות נמחקו"); }, true); break;
  }
});
function goTab(t) {
  ui.tab = t; try { localStorage.setItem("attendance:tab", t); } catch (e) {}
  if (t === "clock") ui.period = periodKeyOf(todayDS());
  render(); window.scrollTo(0, 0);
}
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "restore-file" && el.files && el.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || !Array.isArray(data.shifts)) throw 0;
        confirmBox("לשחזר מהגיבוי?", `בגיבוי ${data.shifts.length} משמרות. הנתונים הנוכחיים יוחלפו.`, "שחזור", () => { state = normalize(data); commit("הגיבוי שוחזר"); });
      } catch (err) { toast("הקובץ הזה אינו גיבוי תקין של שעון הנוכחות"); }
    };
    r.readAsText(el.files[0]); el.value = ""; return;
  }
  if (el.id === "acc-phone") {
    const p = el.value.trim();
    if (!validPhone(p)) { toast("מספר הטלפון לא תקין"); el.value = account ? account.phone : ""; return; }
    const { error } = await sb.from("attendance_accounts").update({ phone: normPhone(p) }).eq("user_id", session.user.id);
    if (error) { toast("לא נשמר. בדקו חיבור לאינטרנט"); return; }
    account = { ...account, phone: normPhone(p) }; toast("הטלפון עודכן"); return;
  }
  const key = el.dataset && el.dataset.set; if (!key) return;
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.type === "number") { v = +v; if (!isFinite(v) || el.value === "") v = DEFAULT_SETTINGS[key]; if (el.min !== "" && v < +el.min) v = +el.min; if (el.max !== "" && v > +el.max) v = +el.max; }
  if (typeof v === "string") v = v.trim();
  state.settings = { ...state.settings, [key]: v };
  if (key === "periodStart") ui.period = null;
  // keep focus while filling a form: only toggles change what the page shows
  commit(el.id.startsWith("o-") ? "" : "נשמר", el.type !== "checkbox");
});
})();
</script>
</body>
</html>
