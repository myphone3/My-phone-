plugins { id 'com.android.application' }

android {
    namespace 'app.matkonim.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.matkonim.tv'
        minSdk 23
        targetSdk 34
        // מספר הגרסה נקבע אוטומטית בכל בנייה (GitHub Actions)
        versionCode((project.findProperty('vc') ?: '1') as int)
        versionName "1.${project.findProperty('vc') ?: '1'}"
    }

    // מפתח חתימה קבוע — כדי שאפשר יהיה לעדכן את האפליקציה בלי להסיר אותה
    signingConfigs {
        release {
            storeFile file('matkonim-tv.keystore')
            storePassword 'matkonimtv'
            keyAlias 'matkonim'
            keyPassword 'matkonimtv'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
