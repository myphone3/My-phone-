name: TV Remote APK

on:
  push:
    branches: [tv-remote]
    paths:
      - "tv-remote/**"
      - ".github/workflows/tv-remote.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-remote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # OpenSSL לאנדרואיד (בשביל ההצפנה של AirPlay). נבנה פעם אחת ונשמר במטמון.
      - uses: actions/cache@v4
        id: openssl-cache
        with:
          path: tv-remote/openssl-android
          key: openssl-3.0.15-android26-v1

      - name: Build OpenSSL for Android
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK"
          export ANDROID_NDK_ROOT="$NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          curl -sSL -o /tmp/openssl.tgz https://github.com/openssl/openssl/releases/download/openssl-3.0.15/openssl-3.0.15.tar.gz
          OUT="$PWD/openssl-android"
          for pair in "armeabi-v7a:android-arm" "arm64-v8a:android-arm64"; do
            ABI="${pair%%:*}"; TARGET="${pair##*:}"
            rm -rf /tmp/ossl && mkdir /tmp/ossl && tar xzf /tmp/openssl.tgz -C /tmp/ossl --strip-components=1
            (cd /tmp/ossl && ./Configure "$TARGET" -D__ANDROID_API__=26 no-shared no-tests no-engine no-dso -fPIC \
              && make -j"$(nproc)" build_generated libcrypto.a)
            mkdir -p "$OUT/$ABI/lib"
            cp /tmp/ossl/libcrypto.a "$OUT/$ABI/lib/"
            cp -r /tmp/ossl/include "$OUT/$ABI/include"
          done
          ls -la "$OUT"/*/lib

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tv-remote.apk
          cp mirror/build/outputs/apk/release/mirror-release.apk mirror.apk
          gh release delete tv-remote-latest --cleanup-tag -y || true
          gh release create tv-remote-latest tv-remote.apk mirror.apk \
            --title "שלט לטלוויזיה (גרסה אחרונה)" \
            --notes "בנייה ${{ github.run_number }} מתוך ${{ github.sha }}" \
            --prerelease \
            --target "${{ github.sha }}"

      - name: Prepare remote web page (gh-pages branch)
        run: |
          rm -rf /tmp/site && cp -r app/src/main/assets/web /tmp/site && touch /tmp/site/.nojekyll
          # הענף הזה הוא רק דף השלט ל-GitHub Pages - Vercel (של החנות) לא צריך לבנות אותו
          echo '{"git":{"deploymentEnabled":false}}' > /tmp/site/vercel.json
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Remote page from ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
