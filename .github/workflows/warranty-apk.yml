name: Warranty receipts APK

on:
  push:
    branches: [main]
    paths:
      - "warranty-android/**"
      - ".github/workflows/warranty-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warranty-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk kabalot.apk
          gh release delete kabalot-apk-latest --cleanup-tag -y || true
          gh release create kabalot-apk-latest kabalot.apk \
            --title "קבלות ואחריות לאנדרואיד (גרסה אחרונה)" \
            --notes "בנייה ${{ github.run_number }} מתוך ${{ github.sha }}" \
            --prerelease \
            --target "${{ github.sha }}"
